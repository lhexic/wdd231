<head>

  <meta property="og:title" content="Lhexiverse Tech Hub">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/large.css"> 
</head>

<body>
  <header>
    <h1>Lhexiverse Tech Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="directory.html">Directory</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Thank You!</h2>
      <p>Your submission has been received successfully.</p>
    </section>

    <div>
      <h3>Submitted Details:</h3>
      <ul id="formDataList"></ul>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Lhexiverse Tech Hub | All rights reserved.</p>
    <p class="footer-links">
      <a href="https://www.youtube.com/your-video-link" target="_blank" rel="noopener">Project Video Demonstration</a> | 
      <a href="attributions.html">Attributions & Sources</a>
    </p>
  </footer>

  <script type="module">
    import { setWayfinding } from "./js/utils.js";
    document.addEventListener("DOMContentLoaded", () => {
      setWayfinding();
      const params = new URLSearchParams(window.location.search);
      const list = document.querySelector("#formDataList");
      if (list && params.toString()) {
        params.forEach((value, key) => {
          const li = document.createElement("li");
          li.innerHTML = `<strong>${key}:</strong> ${decodeURIComponent(value)}`;
          list.appendChild(li);
        });
      }
    });
  </script>
</body>
</html>
