  <meta property="og:title" content="Contact Lhexiverse Tech Hub">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Reach out to Lhexiverse Tech Hub or suggest a resource.">
  <meta property="og:image" content="https://lhexic.github.io/wdd231/Final/images/share-image.avif">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/large.css">
  
</head>
<body>
  <header>
    <span class="site-title">Lhexiverse Tech Hub</span>
    <button id="hamburger" aria-label="Toggle Navigation">&#9776;</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="directory.html">Directory</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Submit a Resource</h1>
      <p>Have a tool or documentation site you want added to the directory?</p>
    </section>

    <form action="thankyou.html" method="get" class="contact-form">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <label for="category">Category:
        <select id="category" name="category" required>
          <option value="">Select Category...</option>
          <option value="Documentation">Documentation</option>
          <option value="Development Tools">Development Tools</option>
          <option value="Design & CSS">Design & CSS</option>
          <option value="Community">Community</option>
        </select>
      </label>

      <button type="submit">Submit Resource</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Lhexiverse Tech Hub | All rights reserved.</p>
    <p class="footer-links">
      <a href="https://www.loom.com/share/e510887477cc4467a22aed7b2b3b4685" target="_blank" rel="noopener">Project Video Demonstration</a> | 
      <a href="attributions.html">Attributions & Sources</a>
    </p>
  </footer>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
