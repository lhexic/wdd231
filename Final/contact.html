<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Lhexiverse Tech Hub</title>
  <meta name="description" content="Submit new developer tools or contact the Lhexiverse Tech Hub administration team.">
  <meta name="author" content="Jonathan Kwadjo Azanu">

  <meta property="og:title" content="Contact Lhexiverse Tech Hub">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Reach out to Lhexiverse Tech Hub or suggest a resource.">
  <meta property="og:image" content="https://lhexic.github.io/wdd131/final/images/share-image.avif">
  <meta property="og:url" content="https://lhexic.github.io/wdd131/final/contact.html">

  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/large.css">
  
</head>
<body>
  <header>
    <h1>Contact Lhexiverse Tech Hub</h1>
    <button id="hamburger" aria-label="Toggle Navigation">&#9776;</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="directory.html">Directory</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Submit a Resource</h2>
      <p>Have a tool or documentation site you want added to the directory?</p>
    </section>

    <form action="thankyou.html" method="get" style="background: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color); max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem;">
      <label for="fullname">Full Name:
        <input type="text" id="fullname" name="fullname" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
      </label>

      <label for="email">Email Address:
        <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
      </label>

      <label for="resourcename">Resource Name:
        <input type="text" id="resourcename" name="resourcename" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
      </label>

      <label for="resourceurl">Resource URL:
        <input type="url" id="resourceurl" name="resourceurl" required placeholder="https://example.com" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
      </label>

      <label for="category">Category:
        <select id="category" name="category" required style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
          <option value="">Select Category...</option>
          <option value="Documentation">Documentation</option>
          <option value="Development Tools">Development Tools</option>
          <option value="Design & CSS">Design & CSS</option>
          <option value="Community">Community</option>
        </select>
      </label>

      <button type="submit" style="background: var(--accent-color); color: #fff; padding: 0.75rem; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Submit Resource</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Lhexiverse Tech Hub | All rights reserved.</p>
    <p style="margin-top: 0.5rem;">
      <a href="https://www.youtube.com/your-video-link" target="_blank" rel="noopener">Project Video Demonstration</a> | 
      <a href="attributions.html">Attributions & Sources</a>
    </p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
